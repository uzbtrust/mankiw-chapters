<svg viewBox="0 0 640 360" width="100%" role="img" aria-labelledby="c9-fig-12-title c9-fig-12-desc"><title id="c9-fig-12-title">Mutlaqo noelastik talabda import</title><desc id="c9-fig-12-desc">Vertikal o‘qda narx, gorizontal o‘qda miqdor. Talab pasayadi, taklif ko‘tariladi; shartli chiziqli egri chiziqlardagi maydonlar matnda izohlangan.</desc><polygon points="224,218 320,218 320,170" fill="#cbe7dd" opacity="1"/><line x1="80" y1="170" x2="570" y2="170" stroke="#81918b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="70" y="174" fill="#33483f" font-size="13" text-anchor="end">P₀</text><line x1="80" y1="218" x2="570" y2="218" stroke="#81918b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="70" y="222" fill="#33483f" font-size="13" text-anchor="end">Pᵥ</text><line x1="224" y1="218" x2="224" y2="290" stroke="#81918b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="224" y="311" fill="#33483f" font-size="13" text-anchor="middle">Qˢ</text><line x1="320" y1="170" x2="320" y2="290" stroke="#81918b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="320" y="311" fill="#33483f" font-size="13" text-anchor="middle">Qᴰ = Q₀</text><line x1="320" y1="50" x2="320" y2="290" stroke="#17695f" stroke-width="3"/><text x="330" y="70" fill="#33483f" font-size="13" text-anchor="start">Vertikal talab</text><text x="291.2" y="206" fill="#33483f" font-size="13" text-anchor="middle">Foyda</text><line x1="80" y1="290" x2="580" y2="290" stroke="#81918b" stroke-width="2"/><line x1="80" y1="290" x2="80" y2="38" stroke="#81918b" stroke-width="2"/><line x1="80" y1="290" x2="560" y2="50" stroke="#c06843" stroke-width="3"/><text x="535" y="60" fill="#c06843" font-size="13" text-anchor="start">Taklif</text><text x="80" y="25" fill="#33483f" font-size="13" text-anchor="start">Narx</text><text x="567" y="347" fill="#33483f" font-size="13" text-anchor="end">Miqdor</text><text x="72" y="306" fill="#33483f" font-size="13" text-anchor="middle">0</text></svg>