<svg viewBox="0 0 640 360" width="100%" role="img" aria-labelledby="c9-fig-1-title c9-fig-1-desc"><title id="c9-fig-1-title">Isolandning savdosiz muvozanati</title><desc id="c9-fig-1-desc">Vertikal o‘qda narx, gorizontal o‘qda miqdor. Talab pasayadi, taklif ko‘tariladi; shartli chiziqli egri chiziqlardagi maydonlar matnda izohlangan.</desc><polygon points="80,50 320,170 80,170" fill="#d7eee7" opacity="1"/><polygon points="80,290 320,170 80,170" fill="#f4ddcd" opacity="1"/><text x="166.4" y="117.2" fill="#33483f" font-size="13" text-anchor="middle">Iste’molchi yutug‘i</text><text x="166.4" y="227.6" fill="#33483f" font-size="13" text-anchor="middle">Ishlab chiqaruvchi yutug‘i</text><line x1="80" y1="170" x2="570" y2="170" stroke="#81918b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="70" y="174" fill="#33483f" font-size="13" text-anchor="end">P₀</text><line x1="320" y1="170" x2="320" y2="290" stroke="#81918b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="320" y="311" fill="#33483f" font-size="13" text-anchor="middle">Q₀</text><line x1="80" y1="290" x2="580" y2="290" stroke="#81918b" stroke-width="2"/><line x1="80" y1="290" x2="80" y2="38" stroke="#81918b" stroke-width="2"/><line x1="80" y1="50" x2="560" y2="290" stroke="#17695f" stroke-width="3"/><text x="540" y="277" fill="#17695f" font-size="13" text-anchor="start">Talab</text><line x1="80" y1="290" x2="560" y2="50" stroke="#c06843" stroke-width="3"/><text x="535" y="60" fill="#c06843" font-size="13" text-anchor="start">Taklif</text><text x="80" y="25" fill="#33483f" font-size="13" text-anchor="start">Narx</text><text x="567" y="347" fill="#33483f" font-size="13" text-anchor="end">Miqdor</text><text x="72" y="306" fill="#33483f" font-size="13" text-anchor="middle">0</text></svg>