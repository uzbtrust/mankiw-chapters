<dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">
  <h2 id="search-title" class="sr-only">Mavzuni toping</h2>
  <div class="search-field">
    <svg class="rd-ico" aria-hidden="true"><use href="#rd-search" /></svg>
    <label class="sr-only" for="search-input">Atama, mavzu yoki savol</label>
    <input
      type="search"
      id="search-input"
      placeholder="Masalan: imkoniyat xarajati, elastiklik, soliq…"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      enterkeyhint="go"
      role="combobox"
      aria-expanded="false"
      aria-controls="search-results"
      aria-autocomplete="list"
    />
    <button class="search-close" id="search-close" type="button" aria-label="Qidiruvni yopish">
      <span>Yopish</span>
      <kbd aria-hidden="true">Esc</kbd>
    </button>
  </div>
  <p id="search-status" class="search-status" role="status">
    <!--@count--> bobning tushuntirishlari va yechimlari bo‘yicha qidirish.
  </p>
  <div id="search-results" role="listbox" aria-label="Natijalar"></div>
  <div class="search-foot" aria-hidden="true">
    <span>
      <kbd>↑</kbd>
      <kbd>↓</kbd>
      tanlash
    </span>
    <span>
      <kbd>↵</kbd>
      ochish
    </span>
    <span>
      <kbd>esc</kbd>
      yopish
    </span>
  </div>
</dialog>
<dialog id="mobile-nav" class="mobile-nav" aria-labelledby="mobile-nav-title">
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="dialog-top">
    <h2 id="mobile-nav-title">Bobni tanlang</h2>
    <button
      id="mobile-nav-close"
      class="icon-button sheet-close"
      type="button"
      aria-label="Boblar menyusini yopish"
    >
      <svg class="rd-ico" aria-hidden="true"><use href="#rd-x" /></svg>
    </button>
  </div>
  <nav id="mobile-chapter-links" aria-label="Mobil boblar"></nav>
</dialog>
<div id="announcer" class="sr-only" aria-live="polite"></div>
