<meta
  name="description"
  content="Mankiw iqtisodiyot kitobining dastlabki <!--@count--> bobi. O‘zbekcha tushuntirishlar, interaktiv chizmalar va izohli mashq yechimlari."
/>
<meta name="theme-color" content="#ffffff" />
<script>
  /* Tema: saqlangan tanlov yoki tizim sozlamasi. Sahifa chizilishidan oldin qo‘llanadi (yonib ketmasligi uchun). */
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('econ-dark'));
      var d = s === null ? matchMedia('(prefers-color-scheme: dark)').matches : !!s;
      if (d) {
        document.documentElement.classList.add('dark');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', '#000000');
      }
    } catch (e) {}
  })();
</script>
